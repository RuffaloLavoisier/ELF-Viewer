<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELF Binary Analyzer Pro</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div class="loading-text" id="loadingText">Loading ELF File...</div>
            <div class="loading-subtext" id="loadingSubtext">Please wait while we analyze the binary</div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="progress-stats">
                <span id="progressPercent">0%</span>
                <span id="progressStep">Initializing...</span>
            </div>
        </div>
    </div>

    <div class="container">
        <header>
            <div class="lang-toggle">
                <button class="lang-btn active" data-lang="en">EN</button>
                <button class="lang-btn" data-lang="ko">한글</button>
            </div>
            <h1>🔍 ELF Binary Analyzer Pro</h1>
            <p>Advanced Parser with Search & Full Analysis</p>
        </header>
        <div class="upload-section" id="uploadSection">
            <h2>Upload ELF Binary</h2>
            <p style="margin:15px 0;color:#8b949e">Drag & drop or click to select</p>
            <input type="file" id="fileInput" accept="*" style="display:none">
            <button class="upload-button" id="uploadButton">📁 Select File</button>
        </div>
        <div id="results" style="display:none">
            <div class="search-bar" id="searchBar">
                <div class="search-controls">
                    <div class="search-input-group">
                        <input type="text" class="search-input" id="searchInput"
                            placeholder="Search hex bytes (7F 45 4C 46), string, or offset (0x1000)">
                        <div class="search-mode">
                            <button class="mode-btn active" data-mode="hex">HEX</button>
                            <button class="mode-btn" data-mode="string">STRING</button>
                            <button class="mode-btn" data-mode="offset">OFFSET</button>
                        </div>
                    </div>
                    <button class="search-btn" id="searchBtn">🔍 Search</button>
                    <div class="search-nav">
                        <button class="nav-btn" id="prevBtn" disabled>◀ Prev</button>
                        <button class="nav-btn" id="nextBtn" disabled>Next ▶</button>
                    </div>
                </div>
                <div class="search-results" id="searchResults"></div>
            </div>
            <div class="info-bar">
                <div class="info-item"><span class="info-label">File:</span><span class="info-value"
                        id="fileName"></span></div>
                <div class="info-item"><span class="info-label">Size:</span><span class="info-value"
                        id="fileSize"></span></div>
                <div class="info-item"><span class="info-label">Arch:</span><span class="info-value"
                        id="fileArch"></span></div>
                <div class="info-item"><span class="info-label">Offset:</span><span class="info-value"
                        id="selectedOffset">-</span></div>
            </div>
            <div class="main-grid">
                <div class="panel">
                    <h2>📋 Structures</h2>
                    <div class="tabs">
                        <button class="tab active" data-tab="elf-header">Header</button>
                        <button class="tab" data-tab="program-headers">Programs</button>
                        <button class="tab" data-tab="section-headers">Sections</button>
                        <button class="tab" data-tab="symbols">Symbols</button>
                        <button class="tab" data-tab="strings">Strings</button>
                        <button class="tab" data-tab="statistics">Stats</button>
                        <button class="tab" data-tab="warnings">Warnings</button>
                    </div>
                    <div id="elf-header" class="tab-content active"></div>
                    <div id="program-headers" class="tab-content"></div>
                    <div id="section-headers" class="tab-content"></div>
                    <div id="symbols" class="tab-content"></div>
                    <div id="strings" class="tab-content"></div>
                    <div id="statistics" class="tab-content"></div>
                    <div id="warnings" class="tab-content"></div>
                </div>
                <div class="panel">
                    <h2>🔢 Hex Dump</h2>
                    <div class="hex-viewer" id="hexViewer"></div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="src/app.js"></script>
</body>

</html>
